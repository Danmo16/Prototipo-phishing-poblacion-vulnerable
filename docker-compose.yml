services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: phishing
      POSTGRES_USER: phishing_user
      POSTGRES_PASSWORD: phishing_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishing_user -d phishing"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tesis_net

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      tesis_net:
        aliases:
          - redis

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: alembic upgrade head
    volumes:
      - .:/app
    environment:
      SECRET_KEY: super-secret-key
      DATABASE_URL: postgresql+psycopg2://phishing_user:phishing_pass@postgres:5432/phishing
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: soulconfusion16@gmail.com
      SMTP_PASSWORD: zsxw sfob rfmm bndw
      SMTP_USE_TLS: "true"
      SMTP_USE_SSL: "false"
      SMTP_FROM_EMAIL: "soulconfusion16@gmail.com"
      SMTP_FROM_NAME: "Simulación Académica"
      DELIVERY_MODE: "smtp"
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      TRACKER_BASE_URL: http://localhost:8001
      OUTBOX_DIR: data/outbox
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tesis_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: super-secret-key
      DATABASE_URL: postgresql+psycopg2://phishing_user:phishing_pass@postgres:5432/phishing
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: soulconfusion16@gmail.com
      SMTP_PASSWORD: zsxw sfob rfmm bndw
      SMTP_USE_TLS: "true"
      SMTP_USE_SSL: "false"
      SMTP_FROM_EMAIL: "soulconfusion16@gmail.com"
      SMTP_FROM_NAME: "Simulación Académica"
      DELIVERY_MODE: "smtp"
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      TRACKER_BASE_URL: http://localhost:8001
      OUTBOX_DIR: data/outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - tesis_net

  tracker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn apps.tracker.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir apps/tracker
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      SECRET_KEY: super-secret-key
      DATABASE_URL: postgresql+psycopg2://phishing_user:phishing_pass@postgres:5432/phishing
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: soulconfusion16@gmail.com
      SMTP_PASSWORD: zsxw sfob rfmm bndw
      SMTP_USE_TLS: "true"
      SMTP_USE_SSL: "false"
      SMTP_FROM_EMAIL: "soulconfusion16@gmail.com"
      SMTP_FROM_NAME: "Simulación Académica"
      DELIVERY_MODE: "smtp"
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      TRACKER_BASE_URL: http://localhost:8001
      OUTBOX_DIR: data/outbox
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - tesis_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app
    environment:
      SECRET_KEY: super-secret-key
      DATABASE_URL: postgresql+psycopg2://phishing_user:phishing_pass@postgres:5432/phishing
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: soulconfusion16@gmail.com
      SMTP_PASSWORD: zsxw sfob rfmm bndw
      SMTP_USE_TLS: "true"
      SMTP_USE_SSL: "false"
      SMTP_FROM_EMAIL: "soulconfusion16@gmail.com"
      SMTP_FROM_NAME: "Simulación Académica"
      DELIVERY_MODE: "smtp"
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      TRACKER_BASE_URL: http://localhost:8001
      OUTBOX_DIR: data/outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - tesis_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: streamlit run apps/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      SECRET_KEY: super-secret-key
      DATABASE_URL: postgresql+psycopg2://phishing_user:phishing_pass@postgres:5432/phishing
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: soulconfusion16@gmail.com
      SMTP_PASSWORD: zsxw sfob rfmm bndw
      SMTP_USE_TLS: "true"
      SMTP_USE_SSL: "false"
      SMTP_FROM_EMAIL: "soulconfusion16@gmail.com"
      SMTP_FROM_NAME: "Simulación Académica"
      DELIVERY_MODE: "smtp"
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      TRACKER_BASE_URL: http://localhost:8001
      OUTBOX_DIR: data/outbox
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - tesis_net

volumes:
  postgres_data:

networks:
  tesis_net:
    driver: bridge